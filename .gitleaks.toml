# gitleaks configuration for cap-protocol
# https://github.com/gitleaks/gitleaks

title = "cap-protocol gitleaks config"

[extend]
useDefault = true

# Allow ONLY the exact fake fixtures used in tests. We deliberately do NOT
# allowlist the entire tests/ path, because that would suppress real secrets
# accidentally committed under tests/ in the future.
#
# If you add a new test fixture, add the exact regex here AND keep the
# fixture clearly identifiable as fake (e.g., the AWS-documented EXAMPLE
# pattern, or a "abcdef…" sequence).
[allowlist]
description = "test fixtures using documented or clearly-fake EXAMPLE keys"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''sk-ant-abcdefghijklmnopqrstuvwxyz12345''',
  '''sk-abcdefghijklmnopqrstuvwxyz1234567890''',
]
