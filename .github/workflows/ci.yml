name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Action versions are pinned to commit SHAs for supply-chain hardening.
# Update via dependabot. SHA -> tag mapping comments preserved for review.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` for reproducibility — uses the committed package-lock.json.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Install gitleaks CLI directly. The wrapping `gitleaks-action` requires
      # a paid license for organizations as of mid-2026; the CLI binary itself
      # is MIT-licensed and free to use anywhere. We pin to a specific release
      # tarball + checksum for supply-chain integrity.
      - name: Install gitleaks CLI
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository for secrets
        run: gitleaks detect --no-banner --redact --config=.gitleaks.toml

  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      # `npm ci` for reproducibility — uses the committed package-lock.json.
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Validate example registry against schema (strict PII)
        run: node scripts/validate-registry.mjs examples/example-registry
