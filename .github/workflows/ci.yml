name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Action versions are pinned to commit SHAs for supply-chain hardening.
# Update via dependabot. SHA -> tag mapping comments preserved for review.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm install --no-audit --no-fund` works whether or not a
      # package-lock.json is committed. Once a lockfile is committed, we
      # SHOULD switch to `npm ci` for reproducibility — see CONTRIBUTING.md.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      # `npm install --no-audit --no-fund` works whether or not a
      # package-lock.json is committed. Once a lockfile is committed, we
      # SHOULD switch to `npm ci` for reproducibility — see CONTRIBUTING.md.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Validate example registry against schema (strict PII)
        run: node scripts/validate-registry.mjs examples/example-registry
