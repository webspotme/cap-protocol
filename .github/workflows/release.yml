name: Release

# Tag-triggered npm publish with sigstore provenance attestation.
# Triggered by pushing a `v*` tag (e.g. `git push origin v0.1.0`).
# Requires a `production` environment with manual approval.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for npm provenance via sigstore

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # `npm ci` for reproducibility — uses the committed package-lock.json.
      - run: npm ci --no-audit --no-fund

      # Build, lint, typecheck, test — same gates as CI.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Smoke test: confirm the built dist/ actually loads (ESM import).
      - name: Smoke test built package
        run: node --input-type=module -e "import('./dist/index.js').then(() => console.log('built package loads cleanly'))"

      # Verify the tag matches package.json version.
      # GITHUB_REF_NAME is a runner-provided env var (not Actions context
      # interpolation), already shell-safe; passing through env: anyway for
      # defense-in-depth review readability.
      - name: Tag matches package.json version
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_REF#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
